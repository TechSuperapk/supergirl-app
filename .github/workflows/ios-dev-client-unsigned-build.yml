name: iOS dev client unsigned build (for Sideloadly + expo start --dev-client)

# Manual only — same macOS-runner cost note as ios-unsigned-build.yml.
# Trigger this once (and again whenever native deps change — new native
# modules, upgraded Expo SDK, etc.) to get an installable dev client. Once
# it's on your phone you do NOT need to re-run this for everyday JS/TS
# changes — `npx expo start --dev-client` + reload handles those instantly,
# exactly like Expo Go. This only needs re-running when something native
# changes.
#
# Difference from ios-unsigned-build.yml: this builds the Debug
# configuration instead of Release. Debug is what makes the app open to the
# dev-client launcher (scan-a-QR / connect-to-Metro screen) instead of
# trying to load a locked-in release JS bundle. expo-dev-client is already
# a dependency in package.json, so `expo prebuild` wires it into the Debug
# target automatically — no extra plugin config needed.
on:
  workflow_dispatch: {}

jobs:
  build-unsigned-dev-client:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Set runtime env vars
        run: echo "EXPO_PUBLIC_API_BASE_URL=https://supergirl-journal-api.onrender.com/api" > .env

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Find workspace + scheme
        id: find
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | node -e "
            let d='';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              const j = JSON.parse(d);
              console.log(j.workspace.schemes[0]);
            });
          ")
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace: $WORKSPACE, scheme: $SCHEME"

      - name: Build unsigned .app (Debug — dev client)
        run: |
          xcodebuild build \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned .ipa
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r unsigned-dev-client.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-dev-client-ipa
          path: unsigned-dev-client.ipa
          retention-days: 7
