name: iOS unsigned build (for Sideloadly)

# Manual only — this consumes macOS runner minutes (billed at a 10x
# multiplier against your GitHub Actions free-minutes quota on private
# repos), so it shouldn't run on every push. Trigger it from the Actions
# tab whenever you actually need a fresh .ipa to sideload.
on:
  workflow_dispatch: {}

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Set runtime env vars
        # .env is gitignored (it holds no secrets, just this public API base
        # URL), so it won't exist in a fresh checkout — recreate it here or
        # the app would silently fall back to the localhost default baked
        # into src/config/api.ts and be unable to reach the real backend.
        run: echo "EXPO_PUBLIC_API_BASE_URL=https://supergirl-journal-api.onrender.com/api" > .env

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Find workspace + scheme
        id: find
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | node -e "
            let d='';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              const j = JSON.parse(d);
              console.log(j.workspace.schemes[0]);
            });
          ")
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace: $WORKSPACE, scheme: $SCHEME"

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned .ipa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: unsigned.ipa
          retention-days: 7
